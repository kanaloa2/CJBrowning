name = "cjbrowning"
main = "src/worker.js"
compatibility_date = "2026-08-23"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "LEADS"
id = "d25c4ae3b00a4da58618805af30135be"

[observability]
enabled = true

# Optional: set a webhook URL (Zapier, Make, CRM, Slack, etc.) to forward
# new leads in real time. Configure via `wrangler secret put LEAD_WEBHOOK_URL`
# or uncomment and set a plain-text var below.
# [vars]
# LEAD_WEBHOOK_URL = "https://hooks.example.com/your-webhook"

# Optional: forward every new lead directly to AgencyZoom via its inbound
# Web Lead Integration webhook (My Agency > Integration > Web Lead
# Integration in the AgencyZoom App Marketplace). The webhook URL itself
# is the credential (no separate API key/header) — it MUST be set as a
# secret, never as a plain-text var, since it's committed to a public repo:
#   wrangler secret put AGENCYZOOM_WEBHOOK_URL
# (or Cloudflare dashboard: Workers & Pages > cjbrowning > Settings >
# Variables and Secrets > Add > type "Secret")
