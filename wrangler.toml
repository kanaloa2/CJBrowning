name = "cjbrowning"
main = "src/worker.js"
compatibility_date = "2026-08-23"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "LEADS"
id = "d25c4ae3b00a4da58618805af30135be"

[observability]
enabled = true

# Optional: set a webhook URL (Zapier, Make, CRM, Slack, etc.) to forward
# new leads in real time. Configure via `wrangler secret put LEAD_WEBHOOK_URL`
# or uncomment and set a plain-text var below.
# [vars]
# LEAD_WEBHOOK_URL = "https://hooks.example.com/your-webhook"

# Optional: forward every new lead directly to AgencyZoom's Lead API.
# Requires an API key from AgencyZoom (Settings > Integrations/API) and the
# exact endpoint/auth header they specify — see src/worker.js for the
# current (unverified) field mapping, which should be confirmed against
# AgencyZoom's docs before going live.
#   wrangler secret put AGENCYZOOM_API_KEY
# [vars]
# AGENCYZOOM_API_URL = "https://api.agencyzoom.com/api/leads"
# AGENCYZOOM_LEAD_SOURCE = "Website"
# AGENCYZOOM_AUTH_HEADER_NAME = "Authorization"
# AGENCYZOOM_AUTH_HEADER_PREFIX = "Bearer "
